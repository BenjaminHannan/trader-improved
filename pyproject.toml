[project]
name = "trader-improved"
version = "0.1.0"
description = "Grinold-Kahn multi-factor, multi-asset (equity/crypto/fx-ETF/commodity-ETF) trading system with point-in-time discipline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "scipy>=1.11",
    "cvxpy>=1.4",
    "requests>=2.31",
    "yfinance>=0.2.40",
    "ccxt>=4.2",
    "fredapi>=0.5.1",
    "pandas-datareader>=0.10",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { include = ["production*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
