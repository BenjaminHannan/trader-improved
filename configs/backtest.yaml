# Walk-forward backtest configuration.
walk_forward:
  train_years: 3               # rolling training window for IC estimation + gate stats
  step_months: 1               # re-estimate IC / lambda / sleeve allocation monthly
  n_tranches: 5                # tranching: K sub-portfolios on grids offset 0..K-1 trading
                               # days, averaged; ~1/K of the book trades per day (smooths the
                               # sqrt-impact cost, time-diversifies the decision point). 1 = off.
  rebalance:                   # per-sleeve cadence (string = one grid for all sleeves)
    default: weekly            # equities / FX-ETF / commodity-ETF: weekly NYSE grid
    crypto: twice_weekly       # crypto: weekly grid + the trading day nearest each Monday
  purge_days: 21               # max factor horizon between train end and test start
  start: "2016-01-01"
  end: null                    # null = latest available

optimizer:
  risk_aversion_init: 10.0
  lambda_bisect_iters: 5       # calibrate lambda so unconstrained sol hits sleeve vol target
  tcost_weight: 1.0
  robust_kappa: 0.0            # opt-in alpha-uncertainty ellipsoid radius (0 = plain MV,
                              # objective bit-identical); see research-robust-alpha.md wiki page
  solver: CLARABEL
  solver_fallback: OSQP

sleeve_vol_target: 0.10        # each sleeve standalone annualized vol target
total_vol_target: 0.10

constraints:
  position_cap:
    equity: 0.02
    crypto: 0.05
    fx_etf: 0.10
    commodity_etf: 0.10
    rates_etf: 0.10
    intl_etf: 0.10
    sector_etf: 0.15
    events: 0.02               # per-market cap inside the event book
  gross_cap: 2.0
  net_band: 0.10
  beta_neutral_band: 0.05
  sector_band: 0.05
  turnover_cap: 0.30           # per rebalance, sum |dw|

allocation:
  method: erc                  # equal risk contribution on sleeve-return EWMA cov
  sleeve_cov_halflife_days: 63
  risk_caps:
    crypto: 0.20               # crypto <= 20% of total risk
    rates_etf: 0.25            # no new sleeve carries more than 25% of total risk
    intl_etf: 0.25
    sector_etf: 0.25
    events: 0.10               # prediction markets: smallest cap — capacity + binary payoffs
    max_any_sleeve: 0.40
  warmup_days: 126             # until then: inverse-vol weight with 0.5 haircut

overlays:
  vol_target:
    target: 0.10
    lookback_days: 21
    clip: [0.0, 1.5]
    ewma_halflife: 33          # EWMA std halflife (~21d-window responsiveness, smoothed)
    deadband: 0.10             # hysteresis: hold prev multiplier unless |new/prev-1| > 10%
  drawdown_control:
    threshold: 0.08            # ramp starts at 8% running DD
    scale: 0.5                 # floor multiplier, reached at 2*threshold (16% DD)
    mode: ramp                 # graduated ramp + hysteresis (was binary 'step')
    recovery_frac: 0.75        # re-risk to 1.0 only once DD recovers below 0.75*threshold (6%)
  macro_derisk:
    enabled: true
    series: [BAMLH0A0HYM2]              # HY OAS credit channel, trailing causal z
    ratio_pairs: [[VIXCLS, VXVCLS]]      # VIX term structure (backwardation = stress);
                                         # level VIX dropped — contrarian pathology,
                                         # see research/wiki/questions/research-vix-term-structure.md
    z_window_days: 252
    z_trigger: 1.5
    scale: 0.6

alpha:
  purify: true                 # neutralize each factor's z against the risk exposures B
  purify_sleeves: [equity, crypto]   # structural sleeves only (N too small for ETF sleeves)
  factor_momentum_gamma: 0.25  # tilt IC weights by trailing single-factor momentum (0.0 = off)

events:
  enabled: true                 # events (Kalshi/Polymarket prediction-market) sleeve
                                 # on/off switch, checked by both production/backtest/
                                 # engine.py (skips the sleeve even if a caller passes an
                                 # event_markets panel) and scripts/run_backtest.py (skips
                                 # the lake read). Independent of data availability: an
                                 # absent/empty curated 'event_markets' dataset always
                                 # degrades to a printed note and a run without the
                                 # sleeve, never a crash, regardless of this flag.

report_dir: reports/
